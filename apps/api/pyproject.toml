[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes · I: import order · B: bugbear · UP: modern syntax · S: security (bandit)
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and obviously-fake secret constants.
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: needs a real DATABASE_URL (skipped when absent, e.g. in CI)"]
